name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 3 * * 1'  # 毎週月曜 12:00 JST(UTC 3:00）に実行
  workflow_dispatch:      # 手動実行ボタンも使えるようにする

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old heartbeat rows (older than 30 days)
        run: |
          CUTOFF=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%S)
          curl -X DELETE "${{ secrets.SUPABASE_URL }}/rest/v1/_heartbeat?pinged_at=lt.${CUTOFF}" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Insert heartbeat row into Supabase
        run: |
          curl -f -sS -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/_heartbeat" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'
